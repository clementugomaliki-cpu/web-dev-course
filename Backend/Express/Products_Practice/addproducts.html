<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Post Exercise</title>
    <link rel="stylesheet" href="addproducts.css">
</head>
<body>
    <h1>Practice with Post HTTP Method</h1>
    <p>This is an exercise to create an API that takes a new product from a user and adds it to a server's in-memory dummy data.</p>
    <div>
      <label for="">Title:
        <input type="text" name="title" class="label"><br>
      </label>
      <label for="">Price:
        <input type="number" name="price" class="label"><br>
      </label>
      <label for="">Description:
        <input type="text" name="description" class="label"><br>
      </label>
      <label for="">Category:
        <input type="text" name="category" class="label"><br>
      </label>
      <label for="">Image:
      <input type="file" name="image" class="label"><br>
      </label>
    </div>
    
    <button class="submit-btn">Add Product</button>
    <div class="results"></div>
    <script src="addproducts.js"></script>
</body>
</html>
